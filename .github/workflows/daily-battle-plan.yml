name: Daily Battle Plan

on:
  schedule:
    # 06:30 UTC = 07:30 CET (winter) / 08:30 CEST (summer) — before London open at 09:00
    - cron: '30 6 * * 1-5'
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the journal file back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements-email.txt

      - name: Generate battle plan and send email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python scripts/send_battle_plan.py

      - name: Commit journal entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add journal/
          git diff --staged --quiet || git commit -m "Auto: Daily battle plan $(date +%Y-%m-%d)"
          git push
